name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, "wip/**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bobo
          POSTGRES_PASSWORD: bobo
          POSTGRES_DB: bobo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bobo" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          BOBO_DATABASE_URL: postgresql+psycopg://bobo:bobo@localhost:5432/bobo_test

  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org id.bobo --project-name bobo_belajar .
          rm -f test/widget_test.dart
          python3 tool/prepare_android.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --exclude-tags shots
      - name: Tangkapan layar gambar materi
        if: github.ref != 'refs/heads/main'
        run: |
          sudo apt-get install -y fonts-noto-color-emoji >/dev/null 2>&1 || true
          flutter test test/shots/shots_test.dart
      - name: Unggah tangkapan layar
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip -qr figure-shots.zip shots
          gh release view figure-shots >/dev/null 2>&1 || gh release create figure-shots --title "Tangkapan layar gambar materi" --notes "Untuk pemeriksaan visual, bukan rilis." --prerelease
          gh release upload figure-shots figure-shots.zip --clobber
      - name: Build APK dan App Bundle
        if: github.ref == 'refs/heads/main'
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Publish ke GitHub Release
        if: github.ref == 'refs/heads/main'
        working-directory: mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "BOBO BELAJAR Android (build terbaru)" --notes "Build otomatis dari GitHub Actions, signing debug. Untuk rilis, tanda tangani dengan upload key." --prerelease
          for a in $(gh release view android-latest --json assets --jq '.assets[].name'); do gh release delete-asset android-latest "$a" -y; done
          cp build/app/outputs/flutter-apk/app-release.apk bobo-belajar-${GITHUB_SHA::7}-debugsigned.apk
          cp build/app/outputs/bundle/release/app-release.aab bobo-belajar-${GITHUB_SHA::7}-unsigned.aab
          gh release upload android-latest bobo-belajar-${GITHUB_SHA::7}-debugsigned.apk bobo-belajar-${GITHUB_SHA::7}-unsigned.aab --clobber

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bobo
      POSTGRES_USER: bobo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobo -d bobo"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      BOBO_DATABASE_URL: postgresql+psycopg://bobo:${POSTGRES_PASSWORD}@db:5432/bobo
    ports:
      - "8000:8000"

  cms:
    build:
      context: ./cms
      args:
        NEXT_PUBLIC_API_BASE_URL: ${CMS_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U bobo -Fc bobo > /backups/bobo-$$(date +%Y%m%d-%H%M).dump && find /backups -name '*.dump' -mtime +14 -delete; sleep 86400; done"]

volumes:
  dbdata:
